<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No remote origin is reachable from this page. The bridge is the only way
     out, and it takes scalars.

     script-src spells out what default-src would otherwise cover because
     pywebview builds every bridge method with `new Function(...)` in the
     api.js it injects after load. Without 'unsafe-eval' WebKit refuses that
     call, window.pywebview.api stays empty, pywebviewready never fires, and
     the window opens blank with no error on either side. 'self' still pins
     the only origin a script may come from. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self';">
<title>Eggie</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="screen"></main>

<!-- Outside #screen on purpose: show() replaces #screen wholesale on every
     navigation, so a notice living inside it would vanish the instant the
     crash handler calls refresh() -- the one moment it needs to stay put. -->
<aside id="notice" hidden>
  <p class="notice-head"><span class="ic ic-alert-triangle" aria-hidden="true"></span>Something went wrong.</p>
  <pre class="notice-detail" id="notice-detail"></pre>
  <button class="btn-secondary" data-action="copy-log">Copy log</button>
  <button class="btn-secondary" data-action="dismiss-notice">Dismiss</button>
</aside>

<!-- Shown while a bridge call or a job is still out. Every screen change
     re-probes the VM through several wsl.exe/limactl calls. -->
<div id="busy" hidden></div>

<template data-screen="account">
  <section class="welcome">
    <div class="welcome-side">
      <span class="welcome-lockup" role="img" aria-label="eggie"><span class="brand-mark"></span>eggie</span>
      <p class="welcome-tag"><b>Let’s get you cooking</b>
        <span>One free account, then your kitchen lives on this computer.</span></p>
    </div>
    <div class="welcome-main">
      <div class="welcome-body">
        <div class="welcome-head">
          <h1 class="display">Create your free Eggie account</h1>
          <p class="lede">An Eggie account keeps track of your projects. It’s free, takes about a
            minute, and you only set it up once on this computer.</p>
        </div>
        <div class="alert alert-warning" data-when="reason">
          <span class="ic ic-alert-triangle" aria-hidden="true"></span>
          <p data-field="reason"></p>
        </div>
        <div class="welcome-actions">
          <div class="row">
            <button class="btn-primary btn-lg" data-action="create-account">Create free account<span class="ic ic-external" aria-hidden="true"></span></button>
            <button class="btn-secondary btn-lg" data-action="existing-account">I already have an account</button>
          </div>
          <p class="hint">Both open app.eggie.io in your browser. This window waits for you.</p>
        </div>
      </div>
    </div>
  </section>
</template>

<template data-screen="account:waiting">
  <section class="welcome">
    <div class="welcome-side">
      <span class="welcome-lockup" role="img" aria-label="eggie"><span class="brand-mark"></span>eggie</span>
      <p class="welcome-tag"><b>Let’s get you cooking</b>
        <span>One free account, then your kitchen lives on this computer.</span></p>
    </div>
    <div class="welcome-main welcome-wait">
      <div class="welcome-back">
        <button class="btn-icon" data-action="sign-in-back" aria-label="Back" title="Back"><span class="ic ic-chevron-left" aria-hidden="true"></span></button>
      </div>
      <div class="welcome-head">
        <span class="wait-status"><span class="spinner spinner-sm" aria-hidden="true"></span>Waiting for you in the browser</span>
        <h1 class="display">Finish in your browser</h1>
        <p class="lede">We opened <span class="mono">app.eggie.io</span> for you. Do these three
          things there. This window carries on by itself when you’re done.</p>
      </div>
      <ol class="wait-steps">
        <li data-when="create"><span class="wait-num">1</span>
          <p><b>Create your account</b><span>With your email and a password. It’s free.</span></p></li>
        <li data-when="existing"><span class="wait-num">1</span>
          <p><b>Sign in</b><span>Use the account you already have.</span></p></li>
        <li class="wait-code-step"><span class="wait-num">2</span>
          <p><b>Check the page shows this code</b><span>If the codes match, it’s really this computer asking.</span></p>
          <span class="wait-code" data-field="user_code"></span></li>
        <li><span class="wait-num">3</span>
          <p><b>Press Approve</b><span>The page asks “Approve this device?”. After that, Eggie opens here by itself.</span></p></li>
      </ol>
      <div class="wait-phone">
        <span class="wait-qr"><canvas data-qr role="img" aria-label="QR code that opens the same page on a phone"></canvas></span>
        <p><b>Or use your phone</b><span>Scan the code and do the same three steps there. The code
          works for <span data-field="minutes"></span>.</span></p>
        <button class="btn-secondary" data-action="open-sign-in-page">Open the page again<span class="ic ic-external" aria-hidden="true"></span></button>
      </div>
    </div>
  </section>
</template>

<template data-screen="where">
  <div class="shell">
    <header class="shell-head"><span class="brand-mark" aria-hidden="true"></span>Eggie</header>
    <section class="shell-body where">
      <div class="where-head">
        <span class="signed-in" data-when="email"><span class="ic ic-check-circle" aria-hidden="true"></span><span>Signed in as <span data-field="email"></span></span></span>
        <h1 class="where-title">Where should your projects live?</h1>
        <p class="lede">Pick one to start. You can add the other one any time.</p>
      </div>
      <div class="where-tiles">
        <article class="where-tile">
          <div class="where-art where-art-cloud" aria-hidden="true">
            <span class="where-kind"><span class="ic ic-cloud"></span>Cloud</span>
            <span class="where-lockup"><span class="brand-mark"></span>eggie</span>
            <dl class="where-facts"><dt>region</dt><dd>Europe</dd><dt>size</dt><dd>Small</dd></dl>
          </div>
          <div class="where-text">
            <div><h2>In the cloud</h2>
              <p>Your own small server. Open projects from any device and share links that keep
                working when this computer is off.</p></div>
            <ul class="checks"><li><span class="ic ic-check" aria-hidden="true"></span>Nothing else to install here</li>
              <li data-from-price hidden><span class="ic ic-check" aria-hidden="true"></span><span>From <span data-field="from_price"></span> a month</span></li></ul>
            <div class="where-cta"><button class="btn-primary" data-action="new-kitchen">Create a cloud kitchen</button></div>
          </div>
        </article>
        <article class="where-tile">
          <div class="where-art where-art-local" aria-hidden="true">
            <span class="where-kind"><span class="ic ic-terminal"></span>This computer</span>
            <span class="where-lockup"><span class="brand-mark"></span>eggie</span>
            <dl class="where-facts"><dt>runs on</dt><dd>this computer</dd><dt>storage</dt><dd>your own disk</dd>
              <dt>price</dt><dd>$0 forever</dd></dl>
          </div>
          <div class="where-text">
            <div><h2>On this computer</h2>
              <p>A small Linux computer inside this one. Free.</p></div>
            <ul class="checks"><li><span class="ic ic-check" aria-hidden="true"></span>Free</li>
              <li><span class="ic ic-check" aria-hidden="true"></span>About 10 GB and 5–10 minutes to set up</li></ul>
            <div class="where-cta"><button class="btn-secondary" data-action="start-install">Set up on this computer</button></div>
          </div>
        </article>
      </div>
      <p class="hint">Made a cloud kitchen on app.eggie.io already? It shows up here by itself.</p>
    </section>
  </div>
</template>

<template data-screen="home">
  <h1>home</h1>
</template>

<template data-screen="kitchen:new">
  <div class="shell">
    <header class="shell-head">
      <button class="btn-icon" data-action="kitchen-back" aria-label="Back" title="Back"><span class="ic ic-chevron-left" aria-hidden="true"></span></button>
      <span class="brand-mark" aria-hidden="true"></span>Eggie</header>
    <section class="shell-body kitchen">
      <div class="kitchen-head">
        <h1 class="kitchen-title">Make a cloud kitchen</h1>
        <p class="lede">A server of your own. You can change the size later.</p>
      </div>
      <div class="alert alert-warning" data-when="error">
        <span class="ic ic-alert-triangle" aria-hidden="true"></span>
        <p data-field="error"></p>
        <button class="btn-secondary" data-action="new-kitchen" data-when="retry">Try again</button>
      </div>
      <div class="kitchen-form" data-when="ready">
        <div class="field field-name">
          <label for="kitchen-name">Name</label>
          <input id="kitchen-name" data-kitchen-name maxlength="100" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <span class="field-label" id="kitchen-size">Size</span>
          <div class="picks" role="radiogroup" aria-labelledby="kitchen-size" data-sizes></div>
        </div>
        <div class="field">
          <span class="field-label" id="kitchen-region">Where</span>
          <div class="picks" role="radiogroup" aria-labelledby="kitchen-region" data-regions></div>
          <p class="hint">We put it in the best data centre on that continent.</p>
        </div>
        <div class="kitchen-foot">
          <button class="btn-primary btn-lg" data-action="continue-to-payment">Continue to payment<span class="ic ic-external" aria-hidden="true"></span></button>
          <span class="hint">Payment opens in your browser once. This window carries on by itself when it’s done.</span>
        </div>
      </div>
    </section>
  </div>
</template>

<!-- Two states: waiting for the payment to make the kitchen, then its setup rows. -->
<template data-screen="kitchen:setup">
  <div class="shell">
    <header class="shell-head"><span class="brand-mark" aria-hidden="true"></span>Eggie</header>
    <section class="shell-body kitchen" data-when="waiting">
      <div class="kitchen-head">
        <span class="wait-status"><span class="spinner spinner-sm" aria-hidden="true"></span>Waiting for you in the browser</span>
        <h1 class="kitchen-title">Finish paying in your browser</h1>
        <p class="lede">We opened <span class="mono">app.eggie.io</span> for you. This window carries on
          by itself when the payment is done.</p>
      </div>
      <div class="row">
        <button class="btn-secondary" data-action="open-checkout-page">Open the page again<span class="ic ic-external" aria-hidden="true"></span></button>
        <button class="btn-secondary" data-action="checkout-back">Back</button>
      </div>
    </section>
    <section class="shell-body kitchen kitchen-setup" data-when="setting_up">
      <div class="kitchen-head">
        <h1 class="kitchen-title">Getting <span data-field="title"></span> ready</h1>
        <p class="lede">About two minutes. When it’s ready we ask which coding agent you use.</p>
      </div>
      <div class="setup-col">
        <p class="setup-paid" data-when="paid_price"><span class="ic ic-check-circle" aria-hidden="true"></span>
          <span>Paid · <span data-field="paid_size"></span> · <span data-field="paid_price"></span> a month</span></p>
        <div class="setup-card">
          <div class="setup-card-head"><span data-setup-current></span>
            <span class="setup-count"><span data-field="steps_done"></span> of 5 done</span></div>
          <div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="5"><span data-setup-bar></span></div>
          <ol class="rows setup-rows" data-setup-rows>
            <li class="row-step"><span class="mark"></span><span class="label">Issuing certificate</span><span class="state"></span></li>
            <li class="row-step"><span class="mark"></span><span class="label">Creating server</span><span class="state"></span></li>
            <li class="row-step"><span class="mark"></span><span class="label">Waiting for an address</span><span class="state"></span></li>
            <li class="row-step"><span class="mark"></span><span class="label">Publishing DNS</span><span class="state"></span></li>
            <li class="row-step"><span class="mark"></span><span class="label">Starting Eggie</span><span class="state"></span></li>
          </ol>
        </div>
      </div>
      <p class="hint" data-field="offline"></p>
      <div class="setup-foot">
        <span class="hint"><span data-when="where_line"><span data-field="where_line"></span> · </span>You can close this window.</span>
        <span class="row">
          <button class="btn-primary" data-action="open-kitchen-page" data-when="failed">Open in the web app<span class="ic ic-external" aria-hidden="true"></span></button>
          <button class="btn-secondary" data-action="go-home">Back to kitchens</button>
        </span>
      </div>
    </section>
  </div>
</template>

<template data-screen="first-run">
  <section class="install first-run">
    <div class="brand-panel" aria-hidden="true">
      <span class="brand-word"><span class="brand-mark"></span>eggie</span>
      <div class="brand-art"><span class="art-egg"></span><span class="art-dot art-periwinkle"></span>
        <span class="art-dot art-coral"></span><span class="art-dot art-orchid"></span>
        <span class="art-pill">ubuntu 24.04</span></div>
    </div>
    <div class="install-main">
      <div class="install-head">
        <h1 class="display">Welcome to Eggie</h1>
        <p class="lede">Eggie sets up a tiny private computer inside your computer,
          so you can build real, working web apps just by chatting with it.</p>
      </div>
      <ol class="steps">
        <li><b>We build you a kitchen</b><span>A small Linux machine in a sealed box.
          Your own files stay exactly where they are.</span></li>
        <li><b>We hire the cook</b><span>A coding agent moves in. It writes the code
          and runs it in there, never out here.</span></li>
        <li><b>You start ordering</b><span>Describe what you want. Watch it get made.
          Change your mind as often as you like.</span></li>
      </ol>
      <div class="row">
        <button class="btn-primary" data-action="start-install">Warm up the kitchen</button>
        <span class="hint">About 4 minutes. You can quit and come back.</span>
      </div>
    </div>
  </section>
</template>

<template data-screen="home:running">
  <section class="pad pad-home">
    <div class="home-main">
      <div class="hero">
        <div class="pan pan-hot" aria-hidden="true"><span class="pan-white"></span>
          <span class="pan-bubble"></span><span class="pan-bubble"></span><span class="pan-bubble"></span></div>
        <div class="hero-text">
          <span class="badge badge-running"><span class="ic ic-check-circle" aria-hidden="true"></span>Running</span>
          <h1 class="display">The kitchen is open</h1>
          <p class="lede">Your machine is up and the cook is at the counter.</p>
        </div>
      </div>
      <div class="update-note" data-when="app_update">
        <span class="ic ic-info" aria-hidden="true"></span>
        <p><b>Eggie <span data-field="app_update"></span> is ready</b>
          <span>A fresh version of the app is waiting.</span></p>
        <button class="btn-update" data-action="app-update">Update now</button>
      </div>
      <div class="row">
        <button class="btn-primary" data-action="enter-console">Open Eggie<span class="ic ic-external" aria-hidden="true"></span></button>
        <button class="btn-secondary" data-action="stop-vm"><span class="ic ic-stop" aria-hidden="true"></span>Stop the kitchen</button>
      </div>
    </div>
    <footer class="odds">
      <div class="tiles">
        <button data-action="doctor">Doctor</button>
        <button data-action="check-updates">Check for updates</button>
        <button data-action="settings">Settings</button>
        <button class="tile-danger" data-action="uninstall">Uninstall</button>
      </div>
      <span class="odds-version">Version <span data-field="app_version"></span><span data-when="runtime_version"> &middot; <span data-field="runtime_version"></span></span></span>
    </footer>
  </section>
</template>

    <div class="home-main">
      <div class="hero">
        <div class="pan pan-asleep" aria-hidden="true"></div>
        <div class="hero-text">
          <span class="badge badge-cold">Stopped</span>
          <h1 class="display">The pan is cold</h1>
          <p class="lede">Everything is saved and waiting. Starting up takes about 20 seconds.</p>

      <div class="update-note" data-when="app_update">
        <span class="ic ic-info" aria-hidden="true"></span>
        <p><b>Eggie <span data-field="app_update"></span> is ready</b>
          <span>A fresh version of the app is waiting.</span></p>
        <button class="btn-update" data-action="app-update">Update now</button>
      </div>
      <div class="row">
        <button class="btn-primary" data-action="start-vm"><span class="ic ic-play" aria-hidden="true"></span>Start the kitchen</button>
        <button class="btn-secondary" disabled>Open Eggie</button>
        <span class="hint">Opens by itself once the pan is hot.</span>
      </div>
    </div>
    <footer class="odds">
      <div class="tiles">
        <button data-action="doctor">Doctor</button>
        <button data-action="check-updates">Check for updates</button>
        <button data-action="settings">Settings</button>
        <button class="tile-danger" data-action="uninstall">Uninstall</button>
      </div>
      <span class="odds-version">Version <span data-field="app_version"></span><span data-when="runtime_version"> &middot; <span data-field="runtime_version"></span></span></span>
    </footer>
  </section>
</template>

<template data-screen="home:wrong">

          <span class="pan-flag"><span class="ic ic-alert-triangle"></span></span>

<template data-screen="unreachable">
  <section class="pad pad-home">
    <div class="home-main">
      <div class="hero">
        <div class="pan pan-asleep" aria-hidden="true"></div>
        <div class="hero-text">

      <div class="row">
        <button class="btn-primary" data-action="go-home"><span class="ic ic-refresh" aria-hidden="true"></span>Try again</button>
        <button class="btn-secondary" data-action="repair">Repair the connection</button>
        <span class="hint">Repair restarts the link. Your projects stay put.</span>
      </div>
      <details class="log"><summary>Show logs</summary>
        <pre data-field="problem"></pre>
        <button class="btn-copy" data-action="copy-log">Copy log</button></details>

      <div class="hero">
        <div class="pan pan-burnt" aria-hidden="true">
          <span class="pan-flag"><span class="ic ic-alert-triangle"></span></span>
        </div>
        <div class="hero-text">
          <span class="badge badge-bad"><span class="ic ic-x-circle" aria-hidden="true"></span>Update didn't finish</span>
          <h1 class="display">The kitchen couldn't catch up</h1>
          <p class="lede">Eggie couldn't update what runs inside your machine, so this app
            can't talk to it yet. Your projects are safe. Check your internet connection and try again.</p>
        </div>
      </div>
      <div class="row">
        <button class="btn-primary" data-action="retry-runtime-update"><span class="ic ic-refresh" aria-hidden="true"></span>Try again</button>
        <button class="btn-secondary" data-action="doctor"><span class="ic ic-activity" aria-hidden="true"></span>Run Doctor</button>
      </div>
      <details class="log"><summary>Show logs</summary>
        <pre data-field="message"></pre>
        <button class="btn-copy" data-action="copy-log">Copy log</button></details>
    </div>
  </section>
</template>

<template data-screen="recover-confirm">
  <section class="pad">
    <h2 class="title">Restarting the kitchen wasn't enough</h2>
    <p class="lede">The next step restarts everything the kitchen runs on.</p>
    <div class="alert alert-warning">
      <span class="ic ic-alert-triangle" aria-hidden="true"></span>
      <p data-field="warning"></p>
    </div>
    <div class="row">
      <button class="btn-danger" data-action="recover-everything"><span class="ic ic-refresh" aria-hidden="true"></span>Restart everything</button>
      <button class="btn-secondary" data-action="go-home">Not now</button>
    </div>
    <details class="log"><summary>Show logs</summary>
      <pre data-field="message"></pre>
      <button class="btn-copy" data-action="copy-log">Copy log</button></details>
  </section>
</template>

<template data-screen="updates">
  <section class="pad centered">
    <div data-when="available">
      <h2 class="title">Eggie <span data-field="available"></span> is ready</h2>
      <p class="lede">Updating closes this window, installs the new version and opens it again.</p>
      <div class="row"><button class="btn-primary" data-action="app-update"><span class="ic ic-download" aria-hidden="true"></span>Update</button>
        <button class="btn-secondary" data-action="go-home">Not now</button></div>
    </div>
    <div data-when="none">
      <h2 class="title">You're up to date</h2>
      <p class="lede">What runs inside the kitchen updates itself whenever the machine starts.</p>
      <div class="row"><button class="btn-secondary" data-action="go-home">Done</button></div>
    </div>
    <p class="hint">Version <span data-field="app_version"></span></p>
  </section>
</template>

<template data-screen="app-update:running">
  <section class="pad centered">
    <h2 class="title">Downloading Eggie <span data-field="available"></span></h2>
    <div class="bar"><span data-field="fraction"></span></div>
    <p class="hint">The window closes when the installer starts.</p>
  </section>
</template>

<template data-screen="settings">
  <section class="pad">
    <h2 class="title">Settings</h2>
    <label class="setting">
      <input type="checkbox" data-setting="autostart" data-action="toggle-autostart">
      <span>Open Eggie when I sign in</span>
    </label>
    <p class="hint" data-when="unavailable">Only an installed Eggie can open when you sign in.</p>
    <p class="hint" data-field="error"></p>
    <div class="setting-account" data-when="signed_in">
      <p><span data-when="email">Signed in as <b data-field="email"></b></span>
        <span data-when="no_email">Signed in to Eggie</span></p>
      <button class="btn-secondary" data-action="sign-out-ask">Sign out</button>
    </div>
    <div class="alert alert-warning" data-sign-out hidden>
      <span class="ic ic-alert-triangle" aria-hidden="true"></span>
      <p>Your agents lose access to your cloud kitchens until you sign in again.</p>
      <div class="row">
        <button class="btn-secondary" data-action="sign-out-cancel">Cancel</button>
        <button class="btn-danger" data-action="sign-out">Sign out</button>
      </div>
    </div>
    <div class="row"><button class="btn-secondary" data-action="settings-back">Back</button></div>
  </section>
</template>

<template data-screen="agent-connect">
  <section class="pad centered">
    <span class="spinner" aria-hidden="true"></span>
    <div data-when="claude-code">
      <h2 class="title">Adding Eggie to Claude Code…</h2>
      <p class="lede">You'll be back in the guide in a moment.</p>
    </div>
    <div data-when="codex">
      <h2 class="title">Making eggie-vm your default WSL distro…</h2>
      <p class="lede">You'll be back in the guide in a moment.</p>
    </div>
  </section>
</template>

<template data-screen="agent-connect:failed">
  <section class="pad centered">
    <h2 class="title">Couldn't add the connection</h2>
    <p class="lede" data-field="message"></p>
    <div class="row">
      <button class="btn-primary" data-action="connect-agent">Try again</button>
      <button class="btn-secondary" data-action="connect-back">Back to the guide</button>
    </div>
  </section>
</template>

<template data-screen="quit-confirm">
  <section class="pad centered">
    <h2 class="title">Eggie is still working</h2>
    <p class="lede">Quitting now stops what it is doing and turns the kitchen off.</p>
    <div class="row">
      <button class="btn-primary" data-action="quit-anyway">Quit anyway</button>
      <button class="btn-secondary" data-action="quit-cancel">Cancel</button>
    </div>
  </section>
</template>

<template data-screen="quitting">
  <section class="pad centered">
    <span class="spinner" aria-hidden="true"></span>
    <h2 class="title">Stopping Eggie…</h2>
    <p class="lede">Turning the kitchen off. The window closes by itself.</p>
  </section>
</template>

<template data-screen="install:running">
  <section class="install">
    <div class="brand-panel" aria-hidden="true">
      <span class="brand-word"><span class="brand-mark"></span>eggie</span>
      <div class="brand-art"><span class="art-egg"></span><span class="art-dot art-periwinkle"></span>
        <span class="art-dot art-coral"></span><span class="art-dot art-orchid"></span>
        <span class="art-pill">ubuntu 24.04</span></div>
    </div>
    <div class="install-main">
      <div class="install-head">
        <p class="overline" data-field="counter"></p>
        <div class="bar"><span data-field="progress"></span></div>
        <h2 class="title">Heating the pan</h2>
        <p class="lede">Nothing here can hurt your computer — the kitchen lives in
          its own sealed box.</p>
        <p class="hint">Good moment for a coffee.</p>
        <p class="hint" data-when="resumed">Continuing setup after the restart — you don't need to do anything.</p>
      </div>
      <div class="rows-col"><ol class="rows" data-rows></ol></div>
    </div>
  </section>
</template>

<template data-screen="install:reboot">
  <section class="install">
    <div class="brand-panel brand-asleep" aria-hidden="true">
      <span class="brand-word"><span class="brand-mark"></span>eggie</span>
      <div class="brand-art"><span class="art-egg"></span><span class="art-dot art-periwinkle"></span>
        <span class="art-dot art-coral"></span><span class="art-dot art-orchid"></span>
        <span class="art-pill">ubuntu 24.04</span></div>
    </div>
    <div class="install-main">
      <div class="install-head">
        <p class="overline" data-field="counter"></p>
        <div class="bar"><span data-field="progress"></span></div>
        <h2 class="title">Time for a quick nap</h2>
        <p class="lede">Your computer needs one restart before the kitchen can open.
          We'll pick up exactly where we left off — nothing is lost.</p>
        <div class="row">
          <button class="btn-primary" data-action="reboot-now">Restart now</button>
          <button class="btn-secondary" data-action="go-home">I'll restart later</button>
        </div>
      </div>
      <div class="rows-col"><ol class="rows" data-rows></ol></div>
    </div>
  </section>
</template>

<template data-screen="install:failed">
  <section class="install install-failed">
    <div class="brand-panel brand-burnt" aria-hidden="true">
      <span class="brand-word"><span class="brand-mark"></span>eggie</span>
      <div class="brand-art"><span class="art-egg"></span><span class="art-dot art-periwinkle"></span>
        <span class="art-dot art-coral"></span><span class="art-dot art-orchid"></span>
        <span class="art-pill">ubuntu 24.04</span></div>
    </div>
    <div class="install-main">
      <div class="install-head">
        <p class="overline" data-field="counter"></p>
        <div class="bar"><span data-field="progress"></span></div>
        <h2 class="title">The burner wouldn't light</h2>
        <p class="lede" data-field="action"></p>
        <div class="row">
          <button class="btn-primary" data-retry data-action="start-install"><span class="ic ic-refresh" aria-hidden="true"></span>Try this step again</button>
          <button class="btn-secondary" data-action="start-over">Start over from scratch</button>
        </div>
        <details class="log" data-when="message"><summary>Show the log</summary>
          <pre data-field="message"></pre>
          <button class="btn-copy" data-action="copy-log">Copy log</button></details>
      </div>
      <div class="rows-col"><ol class="rows" data-rows></ol></div>
    </div>
  </section>
</template>

<template data-screen="doctor">
  <section class="pad pad-fill">
    <h2 class="title">Doctor</h2>
    <pre class="log" data-field="text"></pre>
    <div class="row"><button class="btn-primary" data-action="go-home">Done</button>
      <button class="btn-copy" data-action="copy-log">Copy log</button></div>
  </section>
</template>

<template data-screen="uninstall-confirm">
  <section class="pad">
    <h2 class="title">Close the kitchen for good?</h2>
    <p class="lede">This removes the Linux machine and everything inside it.
      Your own files, outside the kitchen, are untouched.</p>
    <label class="choice"><input type="checkbox" name="purge">
      <b>Also delete downloads and settings</b>
      <span class="check-desc">Frees the disk space Eggie used. You'd start from scratch next time.</span></label>
    <div class="alert alert-danger">
      <span class="ic ic-alert-triangle" aria-hidden="true"></span>
      <p><b>There's no undo.</b> Any project the cook made in there
        goes with it.</p>
    </div>
    <div class="row">
      <button class="btn-danger" data-action="do-uninstall"><span class="ic ic-trash" aria-hidden="true"></span>Remove Eggie</button>
      <button class="btn-secondary" data-action="go-home">Keep it</button>
    </div>
  </section>
</template>

<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
