# Read once, when the eggie-actions tmux server starts.
set -g status off
# A finished run keeps its screen and exit status until the next start.
set -g remain-on-exit on
set -g window-size latest
set -g history-limit 10000
# No prefix, no key or mouse bindings: the console terminal reaches only the action's program.
set -g prefix None
set -g prefix2 None
set -g mouse off
unbind-key -a -T prefix
unbind-key -a -T root
