# The Phase 5 payoff: this file is identical locally and in the cloud, and
# differs only by the environment injected around it. Nothing here may
# hardcode a value that has to change between the two -- see the EGGIE_*
# variables below, each with the current local default.
#
# Traefik's static config lives entirely on `command:` rather than in a
# mounted traefik.yml: a config file and CLI arguments are mutually
# exclusive sources for the same setting, and only the CLI form lets compose
# interpolate the entry port here. `exposedByDefault: false` and
# `network: edge` below are load-bearing -- drop the first and every
# container in the VM gets a route, drop the second and Traefik picks the
# wrong network on a multi-network container.
#
# The edge network name is the literal `edge`, not a variable: it is
# `constants.EDGE_NETWORK`, an authoritative constant the global rulings
# forbid giving a second name. `eggie_api/domain/overlay.py` hardcodes the same
# constant when it labels project containers, so parameterising only the
# Traefik side here would let the two drift -- Traefik watching a network
# nothing is attached to, every route answering 404 with no error anywhere.
services:
  traefik:
    image: traefik:v3.7
    # v3.6+ only: earlier releases ask the daemon for Docker API 1.24, which
    # docker-ce 29 refuses, leaving the Docker provider empty and every route
    # answering 404.
    restart: always
    command:
      - "--entryPoints.web.address=:${EGGIE_EDGE_PORT:-39080}"
      # The default 60 s is for reading the whole request, body included,
      # which cuts off a large folder import mid-upload.
      - "--entryPoints.web.transport.respondingTimeouts.readTimeout=0"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=edge"
    ports:
      - "${EGGIE_EDGE_PORT:-39080}:${EGGIE_EDGE_PORT:-39080}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
      - tunnel

  api:
    image: ${EGGIE_API_IMAGE:-ghcr.io/eggie-io/eggie-api:${EGGIE_VERSION}}
    restart: always
    # No `hostname:` here -- the api service looks itself up with
    # `docker inspect $HOSTNAME` to remove root-owned project files, and
    # that only resolves when $HOSTNAME is still the container id compose
    # assigns by default.
    # 0.0.0.0, not 127.0.0.1: WSL2's localhostForwarding only surfaces guest
    # sockets bound to all interfaces. That also means every other container
    # in the VM can reach an api service that holds the Docker socket --
    # Task 8 closes that gap with a shared token, not this file.
    #
    # Equal on both sides of the colon, and handed to the process as well: the
    # host dials 127.0.0.1:<same port> through the VM's forward, and a mapping
    # the api service does not bind forwards to nothing.
    ports:
      - "${EGGIE_API_PORT:-39099}:${EGGIE_API_PORT:-39099}"
    environment:
      - EGGIE_API_PORT=${EGGIE_API_PORT:-39099}
      - EGGIE_DOMAIN=${EGGIE_DOMAIN:-127-0-0-1.sslip.io}
      - EGGIE_EDGE_PORT=${EGGIE_EDGE_PORT:-39080}
      - EGGIE_GITHUB_CLIENT_ID=${EGGIE_GITHUB_CLIENT_ID:-Ov23lie5k9VqSCKI52Ci}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path on both sides, not negotiable: the api service parses
      # compose files, but the bind-mount paths inside them are resolved by
      # dockerd on the VM, not inside this container. A different path here
      # mounts every user project's relative volume onto an empty directory.
      - /opt/eggie:/opt/eggie
    # Fixable without a rebuild when a VM's docker group GID doesn't match
    # the image's build-time default.
    group_add:
      - "${EGGIE_DOCKER_GID:-999}"
    networks:
      - edge
    # The browser UI's API. Same origin as the page (the web service below),
    # so the session cookie needs no CORS. Priority beats the
    # page's catch-all route; project hosts never match these two names.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eggie-api.rule=(Host(`localhost`) || Host(`127.0.0.1`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.eggie-api.entrypoints=web"
      - "traefik.http.routers.eggie-api.priority=1000"
      - "traefik.http.services.eggie-api.loadbalancer.server.port=${EGGIE_API_PORT:-39099}"

  # The browser UI: static files only, no secrets, no logic. Released under
  # the api service's version -- the two install as a pair. Its router is the
  # catch-all for the UI hosts, so it sits below eggie-api's priority.
  web:
    image: ${EGGIE_WEB_IMAGE:-ghcr.io/eggie-io/eggie-web:${EGGIE_VERSION}}
    restart: always
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eggie-web.rule=Host(`localhost`) || Host(`127.0.0.1`)"
      - "traefik.http.routers.eggie-web.entrypoints=web"
      - "traefik.http.routers.eggie-web.priority=10"
      - "traefik.http.services.eggie-web.loadbalancer.server.port=8080"

  # Started and stopped by the api service while a public URL is on; the
  # installer's profile-less `up -d` never starts it. Its network is shared
  # only with Traefik, but ports the VM publishes stay reachable via the gateway.
  # The token's directory is mounted, not the file: docker would create a
  # missing file mount source as a root-owned directory.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/eggie/token
    volumes:
      - /opt/eggie/tunnel:/run/eggie:ro
    # cloudflared runs as a non-root user; the token is 0640 root:docker.
    group_add:
      - "${EGGIE_DOCKER_GID:-999}"
    networks:
      - tunnel

networks:
  edge:
    external: true
  tunnel: {}
