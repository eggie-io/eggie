name: Release app

# Actions → Release app → Run workflow, on main, with the version already
# bumped in pyproject.toml and host/core/constants.py.
# The release is created last: installed apps offer any app-v* release that
# has its installer and SHA256SUMS, so all three must be built first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version, X.Y.Z (becomes app-vX.Y.Z)"
        required: true

concurrency:
  group: release-app
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow on main, not ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z, not '$VERSION'" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/app-v$VERSION" >/dev/null; then
            echo "app-v$VERSION already exists" >&2
            exit 1
          fi
          latest="$(git tag -l 'app-v*' | sed -n 's/^app-v//p' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)" || true
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "app-v$VERSION is not newer than app-v$latest" >&2
            exit 1
          fi
          # The frozen app reports APP_VERSION and the installers are named
          # from pyproject.toml; a mismatch would ship an app that offers
          # itself as its own update.
          pyproject="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          constant="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' host/core/constants.py)"
          if [[ "$pyproject" != "$VERSION" || "$constant" != "$VERSION" ]]; then
            echo "bump both to $VERSION first: pyproject.toml has '$pyproject', APP_VERSION is '$constant'" >&2
            exit 1
          fi

      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --unreleased --tag app-v${{ inputs.version }} --tag-pattern '^app-v'
            --include-path 'host/**' --include-path 'packaging/windows/**'
            --include-path 'packaging/macos/**' --include-path 'pyproject.toml' --strip all
        env:
          OUTPUT: NOTES.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: NOTES.md
          if-no-files-found: error

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          pip install -e ".[dev]" "fastapi>=0.110" "uvicorn[standard]>=0.30" pyyaml httpx
          python -m pytest -q

  build-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          choco install innosetup -y --no-progress
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File .\packaging\windows\build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: app-windows
          path: dist/EggieSetup-${{ inputs.version }}.exe
          if-no-files-found: error

  build-macos:
    needs: check
    # The signing secrets live in this environment, not in the repository, so
    # only a run a required reviewer approves can read them. Its deployment
    # branch rule should allow main only.
    environment: release
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"

      # A throwaway keychain made the default for this job: codesign and
      # productbuild find the identities in it, and notarytool stores and
      # reads its profile there. It is deleted at the end of the job even
      # when a step fails.
      - name: Set up signing
        env:
          CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          for name in CERTS_P12 CERTS_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            [[ -n "${!name}" ]] || { echo "Secret for $name is missing in the release environment." >&2; exit 1; }
          done

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          kc_pass="$(openssl rand -hex 24)"
          security create-keychain -p "$kc_pass" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$kc_pass" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          p12="$RUNNER_TEMP/certs.p12"
          printf '%s' "$CERTS_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$KEYCHAIN" -P "$CERTS_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$kc_pass" "$KEYCHAIN" >/dev/null
          security find-identity -v "$KEYCHAIN"

          # Pasted secrets pick up stray whitespace and Windows line endings.
          NOTARY_KEY_ID="$(printf '%s' "$NOTARY_KEY_ID" | tr -d '[:space:]')"
          NOTARY_ISSUER="$(printf '%s' "$NOTARY_ISSUER" | tr -d '[:space:]')"
          [[ ${#NOTARY_KEY_ID} -eq 10 ]] || {
            echo "NOTARY_KEY_ID must be 10 characters, got ${#NOTARY_KEY_ID}." >&2; exit 1; }
          [[ "$NOTARY_ISSUER" =~ ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$ ]] || {
            echo "NOTARY_ISSUER is not a UUID." >&2; exit 1; }

          p8="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_KEY_P8" | tr -d '\r' > "$p8"
          grep -q -- "-----BEGIN PRIVATE KEY-----" "$p8" && grep -q -- "-----END PRIVATE KEY-----" "$p8" || {
            echo "NOTARY_KEY_P8 must be the .p8 file's text, BEGIN and END lines included." >&2; exit 1; }

          echo "Key fingerprint (public part, safe to print):"
          openssl pkey -in "$p8" -pubout | shasum -a 256

          xcrun notarytool history --verbose \
            --key "$p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true

          xcrun notarytool store-credentials eggie-notary \
            --key "$p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm -f "$p8"
          

      - name: Build, sign and notarize the package
        env:
          EGGIE_CODESIGN_ID: ${{ vars.MACOS_CODESIGN_ID }}
          EGGIE_INSTALLER_ID: ${{ vars.MACOS_INSTALLER_ID }}
          EGGIE_NOTARY_PROFILE: eggie-notary
        run: |
          # build.sh treats signing as optional and would quietly build an
          # unsigned package; a release must never ship one.
          [[ -n "$EGGIE_CODESIGN_ID" && -n "$EGGIE_INSTALLER_ID" ]] || {
            echo "Set MACOS_CODESIGN_ID and MACOS_INSTALLER_ID in the release environment." >&2
            exit 1; }
          bash packaging/macos/build.sh

      - name: Verify the package
        run: |
          pkg="dist/EggieSetup-$VERSION-${{ matrix.arch }}.pkg"
          pkgutil --check-signature "$pkg"
          xcrun stapler validate "$pkg"
          spctl --assess --type install --verbose=4 "$pkg" 2>&1 | tee spctl.txt
          grep -q "source=Notarized Developer ID" spctl.txt || {
            echo "$pkg is not notarized." >&2; exit 1; }

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          security default-keychain -s login.keychain-db 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: app-macos-${{ matrix.arch }}
          path: dist/EggieSetup-${{ inputs.version }}-${{ matrix.arch }}.pkg
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum EggieSetup-* > SHA256SUMS
          cat SHA256SUMS
          [[ -s ../NOTES.md ]] || echo "No user-facing changes." > ../NOTES.md
          gh release create "app-v$VERSION" EggieSetup-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Eggie $VERSION" \
            --notes-file ../NOTES.md
