name: Release runtime

# Actions → Release runtime → Run workflow, on main, with the new version.
# The tag is pushed last: VMs install a tag as soon as they see it, so its
# images must already be on ghcr.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Runtime version, X.Y.Z (becomes runtime-vX.Y.Z)"
        required: true

concurrency:
  group: release-runtime
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow on main, not ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z, not '$VERSION'" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/runtime-v$VERSION" >/dev/null; then
            echo "runtime-v$VERSION already exists" >&2
            exit 1
          fi
          latest="$(git tag -l 'runtime-v*' | sed -n 's/^runtime-v//p' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)" || true
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "runtime-v$VERSION is not newer than runtime-v$latest" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          pip install -e ".[dev]" "fastapi>=0.110" "uvicorn[standard]>=0.30" pyyaml httpx
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/web/package-lock.json
      - name: Web tests
        working-directory: runtime/web
        run: |
          npm ci
          npm test
          npm run typecheck

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the images
        run: packaging/images/build.sh --push --version "$VERSION"

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "runtime-v$VERSION" -m "Omelet runtime $VERSION"
          git push origin "runtime-v$VERSION"
