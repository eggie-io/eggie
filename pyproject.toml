[project]
name = "eggie"
version = "0.2.3"
requires-python = ">=3.12"
# The host parses no YAML: compose files are read by the API, and
# host/providers/eggie.yaml is handed to limactl as a path.
#
# pywebview is the desktop window; it has no bindings of its own and needs a
# native backend per platform, so pythonnet (Windows, EdgeChromium) and the
# four pyobjc packages (macOS, Cocoa/WebKit) are markers-scoped -- installing
# on the wrong platform would either fail outright or drag an unused native
# toolchain into a bundle meant for the other OS.
dependencies = [
    "typer>=0.12",
    "certifi>=2024.2.2",
    "pywebview>=5.1,<7",
    "pythonnet>=3.0; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "Pillow>=10.0; sys_platform == 'win32'",
    "pyobjc-core>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement>=10.1; sys_platform == 'darwin'",
]

[project.scripts]
eggie = "host.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10", "Pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["host*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["runtime"]
filterwarnings = [
    "ignore:The configuration option \"asyncio_default_fixture_loop_scope\" is unset:DeprecationWarning",
]
# pytest-asyncio (a globally-installed plugin, unused by this project) emits its
# loop-scope warning from pytest_configure, a phase filterwarnings above can't
# reach; setting the option it asks for removes the warning at the source.
asyncio_default_fixture_loop_scope = "function"
